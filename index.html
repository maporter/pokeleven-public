<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No page zoom (the game scales itself), content under notches allowed (viewport-fit=cover:
         #game below keeps to the safe area), the on-screen keyboard never resizes the layout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#101018" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="PokEleven — a 2D pixel-art Pokémon football management sim (fan project)." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokEleven" />
    <meta name="format-detection" content="telephone=no" />
    <title>PokEleven</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #101018; overflow: hidden; overscroll-behavior: none;
      }
      body {
        position: fixed; inset: 0;
        /* The game handles every touch: no scrolling, pinch / double-tap zoom, selection or callouts. */
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      /* The SAFE area (notch, rounded corners, home indicator stay clear). ui/display.ts fits the
         canvas inside it (integer or supersampled scaling) and positions it absolutely. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
        overflow: hidden;
      }
      #game canvas {
        position: absolute; display: block; outline: none; touch-action: none;
        image-rendering: pixelated; image-rendering: crisp-edges;
      }
      /* Supersampled ("sharp") and downscaled fits: smooth filtering of the k-times render. */
      #game canvas.smooth { image-rendering: auto; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #f8f8f0; font: 12px/1 monospace; letter-spacing: 3px; pointer-events: none;
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink { to { visibility: hidden; } }
      /* "Rotate" chip for landscape-only screens on a portrait phone (ui/display.ts). */
      #rotate-hint {
        position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
        padding: 7px 10px 6px; border: 2px solid #5868a0; border-radius: 6px;
        background: #181c30; color: #f8f8f0; cursor: pointer;
        font: 8px/1 "Press Start 2P", monospace; letter-spacing: 0; white-space: nowrap;
        box-shadow: 0 2px 0 #0c1020;
      }
      #rotate-hint[hidden] { display: none; }
    </style>
    <script type="module" crossorigin src="./assets/index-A3nuw9mY.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B6zx9Ky8.css">
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">LOADING</div>
    <noscript><p style="color:#f8f8f0;text-align:center">PokEleven needs JavaScript.</p></noscript>
  </body>
</html>
